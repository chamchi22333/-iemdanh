<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form điểm danh</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="form-page">
    <main class="form-shell">
      <section class="form-card">
        <div class="form-top"></div>
        <div class="form-content">
          <form id="checkinForm" autocomplete="on">
            <input type="hidden" id="sessionId" value="__SESSION_ID__">

            <label>
              <span>Họ và tên <em>(Viết hoa chữ cái đầu)</em></span>
              <input id="fullName" name="fullName" required placeholder="VD: Nguyễn Văn A">
            </label>

            <label>
              <span>Đơn vị</span>
              <input id="unit" name="unit" required placeholder="VD: Khoa Công trình; Viện Cơ khí động lực">
            </label>

            <label>
              <span>Mã sinh viên</span>
              <input id="studentId" name="studentId" required placeholder="VD: 74DCHL2122">
            </label>

            <label>
              <span>Tên lớp</span>
              <input id="className" name="className" required placeholder="VD: 74DCHL21">
            </label>

            <div class="field-group" role="group" aria-labelledby="participationModeLabel">
              <span id="participationModeLabel">Hình thức tham gia</span>
              <label class="check-row">
                <input id="participationInPerson" name="participationMode" type="checkbox" value="Trực tiếp">
                <span>Trực tiếp</span>
              </label>
              <label class="check-row">
                <input id="participationOnline" name="participationMode" type="checkbox" value="Trực tuyến (online)">
                <span>Trực tuyến (online)</span>
              </label>
            </div>

            <label class="check-row">
              <input id="confirmed" name="confirmed" type="checkbox" required>
              <span>Xác nhận tham gia: Có</span>
            </label>

            <p id="message" class="message" role="status"></p>
            <button class="submit-button" type="submit">Gửi điểm danh</button>
          </form>
        </div>
      </section>
    </main>
    <script src="/form.js"></script>
  </body>
</html>
